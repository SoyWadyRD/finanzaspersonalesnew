<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="img/fav.ico" type="image/x-icon">
  <title>Detalles | Finanzas Personales</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: white;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgb(0, 30, 43);
      border-bottom: 1px solid #333;
      width: 100%;
      box-shadow: 0 4px 10px rgba(0, 255, 255, 0.2);
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 1.8rem;
      color: #ffffff;
      margin-bottom: 10px;
    }

    header button {
      padding: 8px 16px;
      background-color: #00a35c;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    header button:hover {
      background-color: #ff1a3c;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      width: 100%;
    }

    #detalle {
      background-color: rgb(0, 30, 43);
      padding: 30px 40px;
      border-radius: 12px;
      border: 1px solid #333;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
    }

    #detalle p {
      margin-bottom: 15px;
      font-size: 1.1rem;
      color: #fff;
    }

    #detalle p strong {
      color: #00a35c;
    }

    #detalle input,
    #detalle select {
      background: #001e2b;
      color: #fff;
      border: 1px solid #00a35c;
      border-radius: 5px;
      padding: 8px 10px;
      width: 100%;
      margin-top: 5px;
      font-size: 1rem;
      transition: 0.2s;
    }

    #detalle input:focus,
    #detalle select:focus {
      outline: none;
      border-color: #00c77f;
      box-shadow: 0 0 6px rgba(0, 163, 92, 0.6);
    }

    #detalle button {
      margin-top: 12px;
      width: 100%;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      color: #fff;
      font-size: 1rem;
    }

    #editarBtn {
      background-color: #00a35c;
    }

    #editarBtn:hover {
      background-color: #00c77f;
    }

    #cancelarEdicionBtn {
      background-color: #ff4d6d;
    }

    #cancelarEdicionBtn:hover {
      background-color: #ff1a3c;
    }

    #eliminarBtn {
      background-color: #ff4d6d;
    }

    #eliminarBtn:hover {
      background-color: #ff1a3c;
    }

    /* MENSAJES Y CONFIRMACIÓN */
    .mensaje-verificacion, .mensaje-error {
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-size: 1.2rem;
      width: 80%;
      max-width: 300px;
      padding: 10px;
      border-radius: 5px;
      z-index: 1001;
      display: none;
    }

    .mensaje-verificacion { background-color: rgba(0,163,92,0.97); color: #fff; }
    .mensaje-error { background-color: rgba(255,0,0,0.9); color: #fff; }

    .confirmacion-eliminacion {
      background-color: rgb(0,0,0);
      color: #fff;
      padding: 20px;
      border-radius: 8px;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 9999;
      width: 300px;
      display: none;
    }

    .confirmacion-eliminacion button {
      background-color: #00a35c;
      color: #fff;
      border: none;
      padding: 10px;
      margin: 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .confirmacion-eliminacion button:hover {
      background-color: #00c77f;
    }

    .confirmacion-eliminacion #cancelarEliminarBtn {
      background-color: #ff4d4d;
    }

    .confirmacion-eliminacion #cancelarEliminarBtn:hover {
      background-color: #ff6666;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      header {
        padding: 15px 20px;
      }

      #detalle {
        padding: 20px;
      }

      header h1 {
        font-size: 1.5rem;
      }

      header button {
        font-size: 0.9rem;
      }
    }

    @media (max-width: 480px) {
      header {
        flex-direction: column;
        text-align: center;
        gap: 10px;
      }

      header button {
        width: 100%;
        font-size: 1rem;
      }

      #detalle {
        padding: 15px;
      }

      #detalle p {
        font-size: 1rem;
      }

      #eliminarBtn {
        width: 100%;
        padding: 10px;
      }
    }

    @media (max-width: 375px) {

      #detalle {
        padding: 15px;
      }
    }

    @media (max-width: 320px) {

      #detalle button {
        font-size: 0.85rem;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Detalle de la Transacción</h1>
    <button onclick="window.location.href='dashboard.html'">Volver</button>
  </header>

  <div id="confirmacionEliminacion" class="confirmacion-eliminacion">
    <p>¿Seguro que deseas eliminar este movimiento?</p>
    <button id="confirmarEliminarBtn">Aceptar</button>
    <button id="cancelarEliminarBtn">Cancelar</button>
  </div>

  <div id="mensajeError" class="mensaje-error"><p></p></div>
  <div id="mensajeExito" class="mensaje-verificacion"></div>

  <main>
    <div id="detalle">
      <p><strong>Tipo de transacción:</strong> <span id="tipo"></span></p>
      <p><strong>Monto:</strong> $<span id="monto"></span></p>
      <p><strong>Fecha:</strong> <span id="fecha"></span></p>
      <p id="fechaLarga" style="color:#ccc; font-size:0.95rem;"></p>
      <p><strong>Categoría:</strong> <span id="categoria"></span></p>
      <p><strong>Descripción:</strong> <span id="descripcion"></span></p>

 <button id="editarBtn"><i class="fas fa-edit"></i> Editar</button>
<button id="cancelarEdicionBtn" style="display:none;">Cancelar</button>

<button id="eliminarBtn">Eliminar</button>

    </div>
  </main>

  <script src="js/detalle.js"></script>
</body>
</html>
