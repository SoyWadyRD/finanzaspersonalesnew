<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" href="img/fav.ico" type="image/x-icon">
<title>Estadísticas | Finanzas Personales</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>


<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
  }

  body {
    background-color: white;
    color: rgb(0,30,43);
    padding: 0;
    margin: 0;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    background: rgb(0, 30, 43);
    border-bottom: 1px solid #333;
    width: 100%;
    box-shadow: 0 4px 10px rgba(0, 255, 255, 0.2);
    flex-wrap: wrap;
  }

  header h1 {
    font-size: 1.8rem;
    color: #ffffff;
    margin-bottom: 10px;
  }

  header button {
    padding: 8px 16px;
    background-color: #00a35c;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }

  header button:hover {
    background-color: #ff1a3c;
  }

  #contenedorMeses {
    padding: 20px 40px;
  }

  .mes {
    background-color: rgb(0, 30, 43);
    border: 1px solid #00a35c;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 0 10px 0 #00a35c;
  }

  .mes h2 {
    margin-bottom: 10px;
    color: white;
  }

  .resumen {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
    font-weight: bold;
    font-size: 1.1rem;
    color: white;
  }

 .grafico {
  width: 100%;
  max-width: 300px;
  height: 300px; /* <-- importante */
  margin: auto;
}

  /* RESPONSIVE */
  @media (max-width: 768px) {
    header { padding: 15px 20px; }
    header h1 { font-size: 1.5rem; }
    header button { font-size: 0.9rem; }
    #contenedorMeses { padding: 15px 20px; }
  }

  @media (max-width: 480px) {
    header { flex-direction: column; text-align: center; gap: 10px; }
    header button { width: 100%; font-size: 1rem; }
    .resumen { flex-direction: column; gap: 5px; }

     .grafico { max-width: 200px; height: 200px; }
  }

  @media (max-width: 375px) {
    .mes { padding: 15px; }
    .resumen { font-size: 1rem; }
    .grafico { max-width: 180px; height: 180px; }
  }

  @media (max-width: 320px) {
    header h1 { font-size: 1.2rem; }
    header button { font-size: 0.9rem; }
    .resumen { font-size: 0.9rem; }
    .grafico { max-width: 160px; height: 160px; }
  }
</style>
</head>
<body>

<header>
  <h1>Estadísticas Mensuales</h1>
  <button onclick="window.location.href='dashboard.html'">Volver</button>
</header>

<div id="contenedorMeses"></div>

<script src="js/estadisticas.js"></script>
</body>
</html>
